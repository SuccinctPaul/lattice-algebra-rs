[workspace]
resolver = "2"
members = ["crates/algebra", "crates/pqc", "crates/zk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV floor verified in CI (matrix: stable + this). The transitive
# dependency tree (via rand/criterion) contains edition-2024 crates,
# which pin the floor at 1.85 regardless of our own edition-2021 code.
rust-version = "1.85.0"

[workspace.dependencies]
rand = { version = "0.9.1", features = ["default"] }
rustfft = "6.4.0"
serde = { version = "1.0.216", features = ["derive"] }
sha3 = "0.10"
zeroize = "1.8"
serde_json = "1.0.133"
lattice-algebra = { path = "crates/algebra" }

[package]
name = "lattice-algebra-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust library for lattice-based cryptography and algebra"
readme = "README.md"
keywords = ["cryptography", "lattice", "algebra"]
categories = ["cryptography", "algorithms", "math", "science"]

[features]
default = []
parallel = ["lattice-algebra/parallel"]

[dependencies]
lattice-algebra = { workspace = true }
lattice-pqc = { path = "crates/pqc" }
lattice-zk = { path = "crates/zk" }
