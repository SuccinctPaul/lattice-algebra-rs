[workspace]
resolver = "2"
members = ["crates/algebra", "crates/pqc", "crates/zk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV floor verified in CI (matrix: stable + this). The transitive
# dependency tree (via rand/criterion) contains edition-2024 crates,
# which pin the floor at 1.85 regardless of our own edition-2021 code.
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/SuccinctPaul/lattice-algebra-rs"
keywords = ["cryptography", "lattice", "algebra"]
categories = ["cryptography", "algorithms", "math", "science"]

[workspace.dependencies]
# Every shared dependency is pulled in its `no_std` shape: the three library
# crates are `#![no_std]` + `alloc` unconditionally, so nothing here may drag
# in `std` transitively. `std` re-enters only through dev-dependencies
# (criterion, serde_json) and the `parallel` feature (rayon).
rand = { version = "0.9.1", default-features = false, features = ["std_rng"] }
serde = { version = "1.0.216", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
rayon = "1.10"
wide = { version = "0.7", default-features = false }
# `core` exposes none of the transcendentals (`sqrt`/`exp`/`powf`/`log2`/…), so
# the float paths go through libm rather than `std`.
libm = { version = "0.2", default-features = false }
serde_json = "1.0.133"
lattice-algebra = { path = "crates/algebra", version = "0.1.0" }
