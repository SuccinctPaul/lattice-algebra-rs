[package]
name = "lattice-pqc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "NIST PQC schemes on the lattice-algebra foundation: ML-DSA (FIPS 204), ML-KEM (FIPS 203), Falcon (round-3 FN-DSA candidate), FrodoKEM, NTRU and Streamlined NTRU Prime (round-3 candidates)"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "pqc"

[features]
default = ["std"]
# `#![no_std]` + `alloc` unconditionally; `std` is the hook for std-only extras
# and is required by `parallel` (see the `algebra` crate for the same shape).
std = ["lattice-algebra/std"]
# Multi-threaded batch APIs and row/block parallelism (rayon).
parallel = ["dep:rayon", "std"]
# Umbrella: every SIMD-accelerated kernel below. The lane paths are written
# on `wide` fixed-width types (no `unsafe`), which execute safely on every
# supported CPU — they lower to AVX2 under `target-feature=+avx2` and
# otherwise decompose into baseline SSE2 halves (x86_64) or NEON (aarch64);
# other targets get the scalar fallbacks. The granular features exist so
# constrained targets can pull in exactly one kernel family (or none — the
# default build is pure scalar).
simd = ["simd-mlkem", "simd-frodo"]
# ML-KEM: transform butterflies on 8x32-bit lanes with an in-lane Montgomery
# reduction (R = 2^16, Montgomery-form twiddle tables).
simd-mlkem = ["dep:wide", "lattice-algebra/simd"]
# FrodoKEM: matrix products as 16-lane wrapping dot/axpy kernels (exact for
# the power-of-two moduli q = 2^15 / 2^16).
simd-frodo = ["dep:wide", "lattice-algebra/simd"]

[dependencies]
lattice-algebra.workspace = true
zeroize.workspace = true
sha2.workspace = true
sha3.workspace = true
rayon = { workspace = true, optional = true }
wide = { workspace = true, optional = true }

[dev-dependencies]
# Tests may use std freely: the crate roots pull `extern crate std` under
# `#[cfg(test)]`.
rand = { version = "0.9.1" }
criterion = { version = "0.5", features = ["html_reports"] }
serde_json.workspace = true

[[bench]]
name = "mldsa"
harness = false

[[bench]]
name = "mlkem"
harness = false

[[bench]]
name = "falcon"
harness = false

[[bench]]
name = "frodo"
harness = false

[[bench]]
name = "ntru"
harness = false

[[bench]]
name = "sntrup"
harness = false

# Batch-API benchmarks require the rayon feature; cargo skips the target
# (instead of failing) on feature sets that exclude it.
[[bench]]
name = "parallel"
harness = false
required-features = ["parallel"]
