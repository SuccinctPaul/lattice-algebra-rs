name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        rust: [ stable, 1.70.0 ]
        include:
          - os: ubuntu-latest
            rust: stable
            clippy: true
            fmt: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.rust == 'stable' && 'clippy,rustfmt' || '' }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose --release

      - name: Run tests
        run: cargo test --verbose --release