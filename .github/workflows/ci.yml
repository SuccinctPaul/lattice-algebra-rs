name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — RustSec advisory sweep

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.rust }}${{ matrix.flags && format(', {0}', matrix.flags) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, '1.85.0'] # 1.85.0 = declared MSRV
        include:
          - rust: stable
            lint: true
          # The `parallel` (rayon) and `simd` (wide) performance features are
          # opt-in; these legs keep them compiling, tested and lint-clean —
          # including the granular SIMD features singly, for constrained
          # targets that enable just one kernel family (or none: the default
          # leg above is pure scalar).
          - rust: stable
            flags: --all-features
          - rust: stable
            flags: --features lattice-pqc/simd
          - rust: stable
            flags: --features lattice-pqc/parallel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.lint && 'clippy,rustfmt' || '' }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

      - name: Clippy (all features)
        if: matrix.all_features
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings

      # RUSTDOCFLAGS instead of `cargo doc -- -D warnings`: cargo >= 1.93
      # rejects rustdoc pass-through arguments after `--`.
      - name: Rustdoc (deny warnings)
        if: matrix.lint
        run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Rustdoc (deny warnings, all features)
        if: matrix.all_features
        run: cargo doc --workspace --all-features --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build
        run: cargo build --workspace ${{ matrix.flags }} --locked --verbose

      - name: Run tests
        run: cargo test --workspace ${{ matrix.flags }} --locked --verbose

      - name: Compile benchmarks
        if: matrix.lint
        run: cargo bench --workspace --locked --no-run

      - name: Compile benchmarks (all features)
        if: matrix.flags == '--all-features'
        run: cargo bench --workspace --all-features --locked --no-run

  audit:
    # Weekly cadence so new RustSec advisories surface without a PR; also
    # runs per push/PR for immediate feedback.
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: RustSec advisories
        run: cargo audit

      - name: Unsafe-code policy (no unsafe blocks anywhere)
        run: |
          ! grep -rn --include='*.rs' -E '\bunsafe\s+(fn|impl|\{)' crates/*/src

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        # Only pushes to main carry a deployable artifact; PRs just verify the build.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/public

  docs-deploy:
    name: Docs deploy
    # Deploys only on pushes to main; PRs verify the build above.
    # Kept separate from docs-build so PR runs never request the
    # `github-pages` environment (its protection rules would block them).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel an in-flight deployment; the site could end up half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        # enablement: true creates the Pages site on first deploy, so no
        # manual repo setup is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
